<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segnale</title>
<link rel="stylesheet" href="comune/base.css">
<style>
.emblema {
  position: absolute;
  overflow: visible;
  pointer-events: none;
}
.emblema * {
  transform-box: view-box;
  transform-origin: 102.74px 102.74px;
}
.animato {
  animation-duration: var(--ciclo);
  animation-iteration-count: infinite;
  animation-timing-function: ease-out;
}
.alone, .punto, .risposta {
  position: absolute;
  pointer-events: none;
}
.alone, .punto, .risposta { border-radius: 50%; }
.cerchio-onda {
  fill: none;
  stroke: rgba(178,224,104,0.6);
  stroke-width: 1.5;
  vector-effect: non-scaling-stroke;
  opacity: 0;
}
.orbita { fill: none; vector-effect: non-scaling-stroke; }
.gira { animation: gira var(--giro) linear infinite; }
.gira-contro { animation: gira var(--giro) linear infinite reverse; }
@keyframes gira { to { transform: rotate(360deg); } }
.base { fill: rgba(255,255,255,0.1); }
.carica { fill: #b2e068; opacity: 0; }
.punto { opacity: 0; animation-name: punto; }
.risposta { opacity: 0; animation-name: risposta; }
/* Il punto si accende al passaggio del fronte e si spegne in fretta: la scia corta fa leggere l'onda come un anello. */
@keyframes punto {
  0% { opacity: 0; }
  1% { opacity: var(--picco); }
  6%, 100% { opacity: 0; }
}
@keyframes risposta {
  0% { opacity: 0; }
  3% { opacity: 1; }
  28%, 100% { opacity: 0; }
}
</style>
</head>
<body>
<div id="scena"></div>
<img id="logo" src="img/brand/LogoEnergyItalyWhite.svg" alt="Energy Italy">
<script src="comune/sfondo.js"></script>
<script>
(function () {
  'use strict';
  // Un solo marchio, sul monitor più a destra: quando è carico il suo impulso attraversa tutta la scrivania,
  // accende la griglia al passaggio e arriva al logo, sul monitor più a sinistra.
  // Parametri: ?velocita=1&onde=2 (anelli intorno al marchio a ogni impulso)
  const velocita = Math.max(0.1, Sfondo.parametro('velocita', 1));
  const onde = Math.max(0, Math.min(4, Math.round(Sfondo.parametro('onde', 2))));

  // Le parti del marchio, nell'ordine in cui si accendono: punto, arco alto, arco sinistro, arco basso, barra, anello.
  const PARTI = [
    '<path d="m42.85,93.57c-5.05,0-9.15,4.1-9.15,9.15s4.1,9.15,9.15,9.15,9.15-4.1,9.15-9.15-4.1-9.15-9.15-9.15Z"/>',
    '<path d="m108.87,65.15c11.9,0,22.5,5.49,29.42,14.06l7.75-7.75c-8.93-10.51-22.26-17.2-37.17-17.2s-28.33,6.72-37.25,17.29l7.76,7.76c6.92-8.62,17.55-14.15,29.5-14.15Z"/>',
    '<path d="m71.13,102.74c0-6.36,1.59-12.35,4.39-17.6l-7.99-7.99c-4.64,7.43-7.34,16.19-7.34,25.59s2.59,17.85,7.08,25.2l8.03-8.03c-2.66-5.15-4.17-10.98-4.17-17.17Z"/>',
    '<path d="m108.87,140.33c-12.11,0-22.88-5.69-29.78-14.51l-7.77,7.77c8.93,10.77,22.44,17.64,37.55,17.64s28.54-6.83,37.47-17.54l-7.77-7.77c-6.91,8.77-17.64,14.42-29.7,14.42Z"/>',
    '<rect x="97.39" y="97.26" width="38.74" height="10.57"/>',
    '<path d="m102.74,0C46.09,0,0,46.09,0,102.74s46.09,102.74,102.74,102.74,102.74-46.09,102.74-102.74S159.39,0,102.74,0Zm0,201.47c-54.44,0-98.74-44.29-98.74-98.74S48.29,4,102.74,4s98.74,44.29,98.74,98.74-44.29,98.74-98.74,98.74Z"/>'
  ];

  // Il disegno occupa un quadrato di MARGINE unità intorno al marchio (diametro 205.47): c'è spazio per orbite e onde.
  const MARGINE = 260;

  const pc = (t) => (Math.min(1, Math.max(0, t)) * 100).toFixed(2) + '%';

  /** Fotogrammi chiave da una lista di [istante 0..1, dichiarazioni CSS]; i punti devono essere in ordine. */
  function fotogrammi(nome, punti) {
    return '@keyframes ' + nome + '{' + punti.map(([t, css]) => pc(t) + '{' + css + '}').join('') + '}';
  }

  /**
   * Un marchio con la sua sequenza. tempi (frazioni del ciclo): accendi = inizio di ogni parte, salita, tieni = fine della
   * carica piena, spento = carica sparita, onde = istanti in cui partono gli anelli, durataOnda.
   */
  function emblema(id, tempi, regole) {
    const vb = (102.74 - MARGINE) + ' ' + (102.74 - MARGINE) + ' ' + (2 * MARGINE) + ' ' + (2 * MARGINE);
    let svg = '<svg width="100%" height="100%" viewBox="' + vb + '" xmlns="http://www.w3.org/2000/svg">';
    tempi.onde.forEach((e, i) => {
      const nome = 'onda-' + id + '-' + i;
      regole.push(fotogrammi(nome, [
        [0, 'opacity:0;transform:scale(1)'], [e, 'opacity:0;transform:scale(1)'], [e + 0.01, 'opacity:0.9;transform:scale(1.05)'],
        [e + tempi.durataOnda, 'opacity:0;transform:scale(2.6)'], [1, 'opacity:0;transform:scale(2.6)']
      ]));
      svg += '<circle class="cerchio-onda animato" cx="102.74" cy="102.74" r="102.74" style="animation-name:' + nome + ';animation-timing-function:cubic-bezier(0.2,0.6,0.4,1)"></circle>';
    });
    svg += '<g class="gira" style="--giro:' + Math.round(140 / velocita) + 's">' +
      '<circle class="orbita" cx="102.74" cy="102.74" r="152" stroke="rgba(255,255,255,0.16)" stroke-width="1" stroke-dasharray="1 9"></circle>' +
      '<circle cx="254.74" cy="102.74" r="4.5" fill="#b2e068"></circle></g>';
    svg += '<g class="gira-contro" style="--giro:' + Math.round(220 / velocita) + 's">' +
      '<circle class="orbita" cx="102.74" cy="102.74" r="196" stroke="rgba(74,144,200,0.35)" stroke-width="1" stroke-dasharray="90 26 6 26"></circle>' +
      '<circle cx="102.74" cy="-93.26" r="3" fill="rgba(255,255,255,0.7)"></circle></g>';
    svg += '<g class="base">' + PARTI.join('') + '</g>';
    PARTI.forEach((parte, i) => {
      const nome = 'carica-' + id + '-' + i;
      const s = tempi.accendi[i];
      const ultima = i === PARTI.length - 1;
      const punti = [[0, 'opacity:0'], [s, 'opacity:0'], [s + tempi.salita, 'opacity:' + (ultima ? 1 : 0.9)]];
      if (ultima) punti.push([s + tempi.salita * 2, 'opacity:0.6']);
      punti.push([tempi.tieni, 'opacity:' + (ultima ? 0.6 : 0.9)], [tempi.spento, 'opacity:0'], [1, 'opacity:0']);
      regole.push(fotogrammi(nome, punti));
      svg += '<g class="carica animato" style="animation-name:' + nome + '">' + parte + '</g>';
    });
    return svg + '</svg>';
  }

  function aggiungiEmblema(html, id, cx, cy, d, tempi, regole) {
    const lato = d * (2 * MARGINE) / 205.47;
    const alone = d * 1.9;
    const nomeAlone = 'alone-' + id;
    const pieno = tempi.accendi[PARTI.length - 1] + tempi.salita;
    regole.push(fotogrammi(nomeAlone, [
      [0, 'opacity:0.3;transform:scale(0.9)'], [tempi.accendi[0], 'opacity:0.3;transform:scale(0.9)'],
      [pieno, 'opacity:1;transform:scale(1.06)'], [tempi.tieni, 'opacity:0.8;transform:scale(1)'],
      [tempi.spento, 'opacity:0.3;transform:scale(0.9)'], [1, 'opacity:0.3;transform:scale(0.9)']
    ]));
    html.push('<div class="alone animato" style="animation-name:' + nomeAlone + ';left:' + (cx - alone / 2).toFixed(0) + 'px;top:' + (cy - alone / 2).toFixed(0) +
      'px;width:' + alone.toFixed(0) + 'px;height:' + alone.toFixed(0) +
      'px;background:radial-gradient(closest-side,rgba(122,181,42,0.32) 0%,rgba(122,181,42,0.1) 45%,rgba(122,181,42,0) 100%)"></div>');
    html.push('<div class="emblema" style="left:' + (cx - lato / 2).toFixed(0) + 'px;top:' + (cy - lato / 2).toFixed(0) +
      'px;width:' + lato.toFixed(0) + 'px;height:' + lato.toFixed(0) + 'px">' + emblema(id, tempi, regole) + '</div>');
  }

  // Ritardo negativo che fa cadere l'istante t (secondi) dentro il ciclo già in corso, senza attese al primo giro.
  const ritardo = (t, ciclo) => ((t % ciclo) - ciclo).toFixed(2) + 's';

  /** Marchio, griglia che si accende e luce sul logo; restituisce la durata del ciclo in secondi. */
  function impulso(s, html, regole) {
    const ciclo = 9 / velocita;
    const k = s.altezza / 1080;
    const mon = s.monitor.slice().sort((a, b) => (b.x + b.w) - (a.x + a.w))[0];
    const d = mon.h * 0.5;
    const cx = mon.x + mon.w * (s.monitor.length > 1 ? 0.6 : 0.68);
    const cy = mon.y + mon.h * 0.5;
    const partenza = 0.5; // istante del ciclo in cui parte l'impulso
    aggiungiEmblema(html, 's', cx, cy, d, {
      accendi: [0.04, 0.12, 0.2, 0.28, 0.36, 0.44], salita: 0.06, tieni: 0.66, spento: 0.82,
      onde: Array.from({ length: onde }, (_, i) => partenza + i * 0.06), durataOnda: 0.28
    }, regole);

    // L'onda viaggia a velocità costante e raggiunge l'angolo più lontano in poco meno di metà ciclo.
    const lontano = Math.max(...[[0, 0], [s.larghezza, 0], [0, s.altezza], [s.larghezza, s.altezza]]
      .map(([x, y]) => Math.hypot(x - cx, y - cy)));
    const v = lontano / (ciclo * 0.42);
    const passo = 56 * k;
    // Alone largo quasi quanto il passo: i punti vicini si fondono in una fascia di luce al passaggio dell'onda.
    const lato = 46 * k;
    for (let y = 14 * k; y < s.altezza; y += passo) {
      for (let x = 14 * k; x < s.larghezza; x += passo) {
        const dist = Math.hypot(x - cx, y - cy);
        if (dist < d * 0.55) continue;
        const picco = (1 - 0.55 * dist / lontano).toFixed(2);
        html.push('<div class="punto animato" style="left:' + (x - lato / 2).toFixed(1) + 'px;top:' + (y - lato / 2).toFixed(1) + 'px;width:' + lato.toFixed(1) +
          'px;height:' + lato.toFixed(1) + 'px;--picco:' + picco + ';animation-delay:' + ritardo(partenza * ciclo + dist / v, ciclo) +
          ';background:radial-gradient(closest-side,#eefad9 0%,#b2e068 7%,rgba(178,224,104,0.45) 16%,rgba(122,181,42,0.17) 45%,rgba(122,181,42,0) 100%)"></div>');
      }
    }

    // Quando l'impulso arriva al logo, il logo si illumina.
    const m = s.monitorLogo;
    const kl = m.h / 1080;
    const lx = m.x + (64 + 210) * kl;
    const ly = m.y + m.h - (112 + 56) * kl;
    const largo = 760 * kl;
    const alto = 360 * kl;
    html.push('<div class="risposta animato" style="z-index:9;left:' + (lx - largo / 2).toFixed(0) + 'px;top:' + (ly - alto / 2).toFixed(0) + 'px;width:' + largo.toFixed(0) +
      'px;height:' + alto.toFixed(0) + 'px;animation-delay:' + ritardo(partenza * ciclo + Math.hypot(lx - cx, ly - cy) / v, ciclo) +
      ';background:radial-gradient(closest-side,rgba(178,224,104,0.4) 0%,rgba(178,224,104,0) 100%)"></div>');
    return ciclo;
  }

  Sfondo.avvia((s) => {
    const k = s.altezza / 1080;
    const m = s.monitorLogo;
    const html = [];
    const regole = [];
    html.push('<div class="strato" style="background:linear-gradient(160deg,#081324 0%,#0d1f38 55%,#12304f 100%)"></div>');
    html.push('<div class="strato" style="opacity:0.5;background-image:radial-gradient(rgba(255,255,255,0.09) 1.2px,transparent 1.6px);background-size:' +
      (28 * k).toFixed(1) + 'px ' + (28 * k).toFixed(1) + 'px"></div>');
    html.push('<div class="strato" style="background:radial-gradient(ellipse ' + (1200 * k) + 'px ' + (650 * k) + 'px at ' + m.x + 'px ' + (m.y + m.h) +
      'px,rgba(8,19,36,0.92) 0%,rgba(8,19,36,0) 70%)"></div>');

    const ciclo = impulso(s, html, regole);

    let stile = document.getElementById('fotogrammi');
    if (!stile) {
      stile = document.createElement('style');
      stile.id = 'fotogrammi';
      document.head.appendChild(stile);
    }
    stile.textContent = regole.join('\n');
    const scena = document.getElementById('scena');
    scena.style.setProperty('--ciclo', ciclo.toFixed(2) + 's');
    scena.innerHTML = html.join('');
    Sfondo.posizionaLogo(document.getElementById('logo'), s);
  });
})();
</script>
</body>
</html>
