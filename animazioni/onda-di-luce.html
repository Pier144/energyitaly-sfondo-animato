<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onda di luce</title>
<link rel="stylesheet" href="comune/base.css">
<style>
.onda {
  position: absolute;
  left: 0;
  width: 1100px;
  pointer-events: none;
  background: linear-gradient(90deg, rgba(var(--accento-rgb),0) 0%, rgba(var(--accento-rgb),0.1) 40%, rgba(var(--accento-rgb),0.5) 86%, rgba(var(--accento-chiaro-rgb),0.8) 95%, rgba(var(--accento-rgb),0) 100%);
  animation: onda var(--durata) linear infinite;
  will-change: transform;
}
@keyframes onda {
  0% { transform: translateX(var(--inizio)) skewX(-12deg); }
  85% { transform: translateX(var(--fine)) skewX(-12deg); }
  100% { transform: translateX(var(--fine)) skewX(-12deg); }
}
.cella {
  position: absolute;
  width: 54px;
  height: 54px;
  box-sizing: border-box;
  border: 1px solid rgba(255,255,255,0.07);
  clip-path: polygon(6px 0, 48px 0, 54px 6px, 54px 48px, 48px 54px, 6px 54px, 0 48px, 0 6px);
  animation: respiro-lieve var(--durata) linear infinite;
}
.amp-media .cella { animation-name: respiro-media; }
.amp-forte .cella { animation-name: respiro-forte; }
.luce {
  position: absolute;
  inset: 0;
  opacity: 0;
  background: var(--luce);
  animation: luce var(--durata) linear infinite;
  animation-delay: inherit;
}
@keyframes respiro-lieve { 0% { transform: scale(1); } 4% { transform: scale(1.1); } 10% { transform: scale(0.95); } 16% { transform: scale(1); } 100% { transform: scale(1); } }
@keyframes respiro-media { 0% { transform: scale(1); } 4% { transform: scale(1.22); } 10% { transform: scale(0.9); } 16% { transform: scale(1); } 100% { transform: scale(1); } }
@keyframes respiro-forte { 0% { transform: scale(1); } 4% { transform: scale(1.38); } 10% { transform: scale(0.84); } 16% { transform: scale(1); } 100% { transform: scale(1); } }
@keyframes luce { 0% { opacity: 0; } 4% { opacity: 0.8; } 30% { opacity: 0; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="scena"></div>
<img id="logo" src="img/brand/LogoEnergyItalyWhite.svg" alt="Energy Italy">
<script src="comune/sfondo.js"></script>
<script>
(function () {
  'use strict';
  // Parametri modificabili da query string: ?durata=16&intensita=1&ampiezza=lieve|media|forte, più i colori (sfondo.js)
  const durata = Sfondo.parametro('durata', 16);
  const intensita = Sfondo.parametro('intensita', 1);
  const ampiezza = Sfondo.parametro('ampiezza', 'lieve');

  const PASSO = 60;
  // Colori delle celle: da sinistra a destra, e verso l'accento vicino all'angolo in alto a destra.
  const C = Sfondo.colori();
  const sinistra = Sfondo.rgb(Sfondo.tono('fondo', 3, -7));
  const destra = Sfondo.rgb(Sfondo.tono('secondario', -7, -11));
  const verde = Sfondo.rgb(C.accento);
  const mescola = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));

  Sfondo.avvia((s) => {
    const W = s.larghezza;
    const H = s.altezza;
    const k = H / 1080;
    const m = s.monitorLogo;
    const inizio = -1300;
    const fine = W + 150;
    const corsa = fine - inizio;

    const scena = document.getElementById('scena');
    scena.className = 'amp-' + ampiezza;
    scena.style.setProperty('--durata', durata + 's');
    scena.style.setProperty('--luce', Sfondo.rgba('accentoChiaro', intensita));

    let html = '';
    html += '<div class="strato" style="background:linear-gradient(100deg,' + Sfondo.tono('fondo', -1) + ' 0%,' + Sfondo.tono('fondo', 4) + ' 45%,' +
      C.fondoChiaro + ' 100%)"></div>';
    html += '<div class="strato" style="opacity:0.3;background:radial-gradient(ellipse ' + (1500 * k) + 'px ' + (900 * k) + 'px at 100% 0%,' +
      Sfondo.rgba('accento', 0.9) + ' 0%,' + Sfondo.rgba('accento', 0.42) + ' 35%,' + Sfondo.rgba('accento', 0) + ' 70%)"></div>';
    html += '<div class="onda" style="top:-80px;height:' + (H + 160) + 'px;opacity:' + (0.35 * intensita) +
      ';--inizio:' + inizio + 'px;--fine:' + fine + 'px"></div>';

    const colonne = Math.ceil(W / PASSO);
    const righe = Math.ceil(H / PASSO);
    for (let r = 0; r < righe; r++) {
      for (let c = 0; c < colonne; c++) {
        const cx = c * PASSO + 30;
        const cy = r * PASSO + 30;
        const dx = (W - cx) / (1500 * k);
        const dy = cy / (900 * k);
        const vicino = Math.max(0, 1 - Math.sqrt(dx * dx + dy * dy));
        const col = mescola(mescola(sinistra, destra, cx / W), verde, Math.pow(vicino, 1.2) * 0.85);
        // Istante (frazione del ciclo) in cui il fronte inclinato dell'onda raggiunge la cella.
        const picco = 0.85 * (cx - 1045 + 0.2126 * (cy - H / 2) - inizio) / corsa;
        const ritardo = ((picco - 0.04) * durata).toFixed(2);
        html += '<div class="cella" style="left:' + (c * PASSO + 3) + 'px;top:' + (r * PASSO + 3) +
          'px;background:rgb(' + col.join(',') + ');animation-delay:' + ritardo + 's"><div class="luce"></div></div>';
      }
    }

    html += '<div class="strato" style="background:radial-gradient(ellipse ' + (1500 * k) + 'px ' + (950 * k) + 'px at ' + m.x + 'px ' + (m.y + m.h) +
      'px,' + C.velo + ' 0%,' + Sfondo.rgba('velo', 0.94) + ' 32%,' + Sfondo.rgba('velo', 0) + ' 75%)"></div>';
    scena.innerHTML = html;
    Sfondo.posizionaLogo(document.getElementById('logo'), s);
  });
})();
</script>
</body>
</html>
