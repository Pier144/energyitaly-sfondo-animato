<sc-if value="{{immagine}}" hint-placeholder-val="{{ false }}">

<sc-if value="{{mostraLogo}}" hint-placeholder-val="{{ true }}">
<img src="/_blob/38083dcb816ac5acf6d5cf54e2313d24" alt="" style="position: absolute; left: 3.3%; bottom: 10%; width: {{logoW}}; height: auto; pointer-events: none">

<script type="text/x-dc" data-dc-script data-props='{"tipo":{"editor":"enum","options":["onda-di-luce","onde-di-energia","paesaggio-rinnovabile","circuito","aurora","immagine","video","html"],"default":"onda-di-luce"},"logo":{"editor":"boolean","default":true},"logoLarghezza":{"editor":"text","default":"22%"},"$preview":{"width":320,"height":180}}'>
class Component extends DCLogic {
  renderVals() {
    const t = this.props.tipo ?? 'onda-di-luce';
    const aziendali = ['onda-di-luce', 'onde-di-energia', 'paesaggio-rinnovabile', 'circuito', 'aurora'];
    return {
      onda: t === 'onda-di-luce',
      onde: t === 'onde-di-energia',
      paesaggio: t === 'paesaggio-rinnovabile',
      circuito: t === 'circuito',
      aurora: t === 'aurora',
      immagine: t === 'immagine',
      video: t === 'video',
      html: t === 'html',
      mostraLogo: aziendali.includes(t) && (this.props.logo ?? true),
      logoW: this.props.logoLarghezza ?? '22%'
    };
  }
}
</script>
